[project]
name = "jx3-bot"
version = "0.1.0"
description = "QQ bot using the official QQ API"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "httpx>=0.27,<0.29",
    "websockets>=14,<16",
    "python-dotenv>=1,<2",
    "PyJWT[crypto]>=2.9,<3",
    "cryptography>=46,<49",
    "tzdata>=2025.2",
]

[project.scripts]
jx3_bot = "jx3_bot.__main__:main"

[build-system]
requires = ["setuptools>=68,<81"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
namespaces = false

[tool.setuptools.package-data]
jx3_bot = ["modules/weather/templates/*.toml"]
